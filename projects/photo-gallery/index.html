<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
    </header>
    <main>
        <div class="gallery">
            <img src="images/photo1.jpg" alt="Photo 1" onclick="openModal(this)">
            <img src="images/photo2.jpg" alt="Photo 2" onclick="openModal(this)">
            <img src="images/photo3.jpg" alt="Photo 3" onclick="openModal(this)">
            <img src="images/photo4.jpg" alt="Photo 4" onclick="openModal(this)">
            <img src="images/photo5.jpg" alt="Photo 5" onclick="openModal(this)">
            <img src="images/photo6.jpg" alt="Photo 6" onclick="openModal(this)">
            <img src="images/photo7.jpg" alt="Photo 7" onclick="openModal(this)">
            <img src="images/photo8.jpg" alt="Photo 8" onclick="openModal(this)">
            <img src="images/photo9.jpg" alt="Photo 9" onclick="openModal(this)">
            <img src="images/photo10.jpg" alt="Photo 10" onclick="openModal(this)">
            <img src="images/photo11.jpg" alt="Photo 11" onclick="openModal(this)">
            <img src="images/photo12.jpg" alt="Photo 12" onclick="openModal(this)">
            <img src="images/photo13.jpg" alt="Photo 13" onclick="openModal(this)">
            <img src="images/photo14.jpg" alt="Photo 14" onclick="openModal(this)">
            <img src="images/photo15.jpg" alt="Photo 15" onclick="openModal(this)">
            <img src="images/photo16.jpg" alt="Photo 16" onclick="openModal(this)">
            <img src="images/photo17.jpg" alt="Photo 17" onclick="openModal(this)">
            <img src="images/photo18.jpg" alt="Photo 18" onclick="openModal(this)">
            <img src="images/photo19.jpg" alt="Photo 19" onclick="openModal(this)">
        </div>
    </main>
    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

    <!-- Modal for full-size image -->
    <div id="modal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
