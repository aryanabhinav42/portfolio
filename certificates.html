<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates - Dev Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        header {
            position: sticky;
            top: 0;
            background-color: black;
            padding: 10px;
            text-align: center;
            z-index: 100;
        }
        header a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 18px;
        }
        header a:hover {
            text-decoration: underline;
        }
        .certificates {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }
        .certificate img {
            max-width: 300px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html">← Back to Home</a>
    </header>
    <div id="intro">
        <h1>My Certificates</h1>
        <p>Here are my certificates:</p>
    </div>
    <div class="certificates">
        <div class="certificate"><img src="certificates/certificate1.jpg" alt="Certificate 1"></div>
        <div class="certificate"><img src="certificates/certificate2.jpg" alt="Certificate 2"></div>
        <div class="certificate"><img src="certificates/certificate3.jpg" alt="Certificate 3"></div>
        <div class="certificate"><img src="certificates/certificate4.jpg" alt="Certificate 4"></div>
        <div class="certificate"><img src="certificates/certificate5.jpg" alt="Certificate 5"></div>
        <!-- Add more as needed based on the number of files -->
    </div>
</body>

</html>
